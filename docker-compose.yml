services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - urban_data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      URBAN_DB_PATH: /app/data/urban_intelligence.db
      EVIDENCE_DIR: /app/data/evidence

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  urban_data:
