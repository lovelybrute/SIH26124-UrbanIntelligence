services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - urban_data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: ${APP_ENV:-development}
      URBAN_DB_PATH: /app/data/urban_intelligence.db
      EVIDENCE_DIR: /app/data/evidence
      MAX_EVIDENCE_MB: ${MAX_EVIDENCE_MB:-25}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      API_WRITE_KEY: ${API_WRITE_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  urban_data:
